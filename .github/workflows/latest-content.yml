name: Latest blog posts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update profile README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Latest blog posts
        uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://usetemplates.store/blog/rss.xml"
          readme_path: "./profile/README.md"
          comment_tag_name: "BLOG-POST-LIST"
          max_post_count: 5
          template: "$newline- [$title]($url)"
          commit_message: "Update latest blog posts"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
